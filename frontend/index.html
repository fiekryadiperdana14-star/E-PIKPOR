<!DOCTYPE html>
<html lang="id" ng-app="epikporApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-PIKPOR — Siaga Wiken Unit Gakkum | Polrestabes Bandung</title>
    <meta name="description" content="Digitalisasi Piket Laporan & Restrukturisasi SOP Sistem Piket Penguatan Pasukan Unit Gakkum Pada Akhir Pekan Dan Libur Nasional Di Polrestabes Bandung">
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- App Layout for Logged In Users -->
    <div class="d-flex" style="min-height: 100vh;" ng-show="isLoggedIn()">
        
        <!-- Sidebar (Offcanvas on Mobile, Permanent on Desktop) -->
        <div class="offcanvas-lg offcanvas-start app-sidebar flex-shrink-0" tabindex="-1" id="sidebarNav" ng-controller="NavbarCtrl">
            <div class="offcanvas-header border-bottom border-secondary border-opacity-25 pb-3 pt-4 px-4">
                <a class="navbar-brand fw-bold text-primary text-decoration-none fs-4" href="#!/">
                    <i class="bi bi-shield-check me-2"></i>E-PIKPOR
                </a>
                <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebarNav"></button>
            </div>
            
            <div class="offcanvas-body d-flex flex-column px-3 py-4 overflow-y-auto">
                <ul class="navbar-nav flex-column w-100 gap-2 mb-auto">
                    <li class="nav-item">
                        <a class="nav-link w-100" href="#!/dashboard" ng-class="{'active': isActive('/dashboard')}"><i class="bi bi-speedometer2 me-3"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link w-100" href="#!/buat-laporan" ng-class="{'active': isActive('/buat-laporan')}"><i class="bi bi-file-earmark-plus me-3"></i>Buat Laporan</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link w-100" href="#!/pelimpahan" ng-class="{'active': isActive('/pelimpahan')}"><i class="bi bi-arrow-left-right me-3"></i>Estafet Laporan</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link w-100" href="#!/jadwal-piket" ng-class="{'active': isActive('/jadwal-piket')}"><i class="bi bi-calendar3 me-3"></i>Jadwal Piket</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link w-100" href="#!/siaga-wiken" ng-class="{'active': isActive('/siaga-wiken')}">
                            <i class="bi bi-shield-exclamation me-3"></i>Siaga Wiken
                            <span class="badge bg-danger rounded-pill ms-2 pulse-anim" ng-if="globalStats.isSiagaWiken" style="font-size: 0.6rem;">AKTIF</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link w-100" href="#!/sop" ng-class="{'active': isActive('/sop')}"><i class="bi bi-journal-check me-3"></i>SOP Gakkum</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link w-100" href="#!/struktur" ng-class="{'active': isActive('/struktur')}"><i class="bi bi-diagram-3 me-3"></i>Struktur Unit</a>
                    </li>
                    
                    <li class="nav-item mt-3 pt-3 border-top border-secondary border-opacity-25" ng-if="user.role === 'admin' || user.role === 'kanit'">
                        <span class="nav-category d-block mb-2 text-muted fw-bold" style="font-size: 0.7rem; letter-spacing: 1px; padding-left: 1rem;">ADMINISTRATOR</span>
                    </li>
                    <li class="nav-item" ng-if="user.role === 'admin' || user.role === 'kanit'">
                        <a class="nav-link w-100" href="#!/users" ng-class="{'active': isActive('/users')}"><i class="bi bi-people me-3"></i>Manajemen Akun</a>
                    </li>
                    <li class="nav-item" ng-if="user.role === 'admin' || user.role === 'kanit'">
                        <a class="nav-link w-100" href="#!/kalender-libur" ng-class="{'active': isActive('/kalender-libur')}"><i class="bi bi-calendar-heart me-3"></i>Kalender Libur</a>
                    </li>
                </ul>
                
                <!-- User Profile / Logout (Bottom of Sidebar) -->
                <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 w-100">
                    <div class="d-flex align-items-center mb-3 px-2">
                        <div class="user-avatar avatar-admin me-3 flex-shrink-0" ng-if="user.role === 'admin'"><i class="bi bi-person-gear"></i></div>
                        <div class="user-avatar avatar-danregu me-3 flex-shrink-0" ng-if="user.role === 'kanit' || user.role === 'kasubnit' || user.role === 'danregu'"><i class="bi bi-person-badge"></i></div>
                        <div class="user-avatar avatar-anggota me-3 flex-shrink-0" ng-if="user.role === 'anggota' || user.role === 'bamin'"><i class="bi bi-person"></i></div>
                        <div class="text-truncate">
                            <div class="text-white fw-bold" style="font-size: 0.85rem;">{{ user.nama_lengkap }}</div>
                            <div class="text-muted" style="font-size: 0.75rem;">{{ user.pangkat }} - {{ user.nrp }}</div>
                        </div>
                    </div>
                    <button class="btn btn-outline-danger w-100 d-flex justify-content-center align-items-center gap-2" ng-click="logout()">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content Area Wrapper -->
        <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
            
            <!-- Mobile Header (Only visible on small screens) -->
            <header class="app-header-mobile d-flex d-lg-none align-items-center justify-content-between px-3 py-2 w-100 border-bottom border-secondary border-opacity-25 bg-primary bg-opacity-10 backdrop-blur">
                <a class="navbar-brand fw-bold text-primary text-decoration-none fs-5" href="#!/">
                    <i class="bi bi-shield-check me-1"></i>E-PIKPOR
                </a>
                <button class="btn text-white p-1 border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarNav">
                    <i class="bi bi-list fs-1"></i>
                </button>
            </header>

            <!-- Actual View Container -->
            <div class="main-container flex-grow-1 overflow-y-auto">
                <div ng-view></div>
            </div>
            
        </div>
    </div>

    <!-- Login/Landing Page Layout (No Sidebar) -->
    <div ng-hide="isLoggedIn()">
        <div ng-view></div>
    </div>

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- App JS -->
    <script src="js/app.js"></script>
</body>
</html>
