<!DOCTYPE html>
<html lang="id" ng-app="epikporApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-PIKPOR — Siaga Wiken Unit Gakkum | Polrestabes Bandung</title>
    <meta name="description" content="Digitalisasi Piket Laporan & Restrukturisasi SOP Sistem Piket Penguatan Pasukan Unit Gakkum Pada Akhir Pekan Dan Libur Nasional Di Polrestabes Bandung">
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg glass-nav" ng-controller="NavbarCtrl" ng-show="isLoggedIn()">
        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand fw-bold" href="#!/">
                <i class="bi bi-shield-check me-2"></i>E-PIKPOR
            </a>

            <!-- Siaga Wiken Indicator (Desktop) -->
            <div class="siaga-indicator d-none d-lg-flex" ng-if="globalStats.isSiagaWiken">
                <span class="siaga-badge-nav pulse-anim">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>SIAGA WIKEN
                </span>
            </div>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="offcanvas-lg offcanvas-start glass-sidebar" tabindex="-1" id="sidebarNav" aria-labelledby="sidebarNavLabel">
                <div class="offcanvas-header d-lg-none border-bottom border-secondary border-opacity-25 mb-3">
                    <h5 class="offcanvas-title text-primary" id="sidebarNavLabel">
                        <i class="bi bi-shield-lock me-2"></i>E-PIKPOR
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebarNav"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav ms-lg-auto flex-column flex-lg-row align-items-start align-items-lg-center gap-2 gap-lg-1">
                        <li class="nav-item w-100">
                            <a class="nav-link w-100" href="#!/dashboard"><i class="bi bi-speedometer2 me-2 me-lg-1"></i>Dashboard</a>
                        </li>
                        <li class="nav-item w-100">
                            <a class="nav-link w-100" href="#!/buat-laporan"><i class="bi bi-file-earmark-plus me-2 me-lg-1"></i>Buat Laporan</a>
                        </li>
                        <li class="nav-item w-100">
                            <a class="nav-link w-100" href="#!/pelimpahan"><i class="bi bi-arrow-left-right me-2 me-lg-1"></i>Estafet</a>
                        </li>
                        <li class="nav-item w-100">
                            <a class="nav-link w-100" href="#!/jadwal-piket"><i class="bi bi-calendar3 me-2 me-lg-1"></i>Jadwal Piket</a>
                        </li>
                        <li class="nav-item w-100">
                            <a class="nav-link w-100" href="#!/siaga-wiken"><i class="bi bi-shield-exclamation me-2 me-lg-1"></i>Siaga Wiken</a>
                        </li>
                        <li class="nav-item w-100">
                            <a class="nav-link w-100" href="#!/sop"><i class="bi bi-journal-check me-2 me-lg-1"></i>SOP</a>
                        </li>
                        <li class="nav-item w-100">
                            <a class="nav-link w-100" href="#!/struktur"><i class="bi bi-diagram-3 me-2 me-lg-1"></i>Struktur</a>
                        </li>
                        <li class="nav-item w-100" ng-if="user.role === 'admin' || user.role === 'kanit'">
                            <a class="nav-link w-100" href="#!/users"><i class="bi bi-people me-2 me-lg-1"></i>Manajemen Akun</a>
                        </li>
                        <li class="nav-item w-100" ng-if="user.role === 'admin' || user.role === 'kanit'">
                            <a class="nav-link w-100" href="#!/kalender-libur"><i class="bi bi-calendar-heart me-2 me-lg-1"></i>Kalender Libur</a>
                        </li>
                        <li class="nav-item ms-lg-3 mt-3 mt-lg-0 border-top border-secondary border-opacity-25 pt-3 pt-lg-0 d-block d-lg-flex align-items-center w-100">
                            <span class="user-badge-nav d-inline-block mb-2 mb-lg-0">
                                <i class="bi bi-person-badge"></i> 
                                {{ user.pangkat }} {{ user.nama_lengkap | limitTo:20 }}
                            </span>
                        </li>
                        <li class="nav-item ms-lg-2 w-100 w-lg-auto">
                            <button class="btn btn-outline-danger btn-sm w-100" ng-click="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="main-container" ng-show="isLoggedIn()">
        <div ng-view></div>
    </div>
    <div ng-hide="isLoggedIn()">
        <div ng-view></div>
    </div>

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- App JS -->
    <script src="js/app.js"></script>
</body>
</html>
